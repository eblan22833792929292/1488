<!DOCTYPE html>
<html>
<head>
    <title>Evade Mobile Fixed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; touch-action: none; }
        #game { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 15px; left: 15px; color: white; text-shadow: 2px 2px #000; pointer-events: none; z-index: 10; }
        
        /* Экран смерти */
        #died { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(150,0,0,0.7); z-index: 100; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        #died h1 { font-size: 70px; margin: 0; color: #ff0000; }

        /* Новый джойстик */
        #joy-back { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid #fff; z-index: 50; }
        #joy-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: #fff; border-radius: 50%; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="ui">EVADE V2 <br> Все мемы разблокированы!</div>

    <div id="died" onclick="location.reload()">
        <h1>DIED</h1>
        <p>НАЖМИ ДЛЯ РЕСТАРТА</p>
    </div>

    <div id="joy-back"><div id="joy-knob"></div></div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width/2, y: canvas.height/2, size: 20, speed: 6 };
        let bot = { x: 0, y: 0, size: 80, speed: 4.5, img: new Image() };
        bot.img.src = 'https://i.imgur.com'; // Обунга

        let joy = { x: 0, y: 0, active: false };
        let isDead = false;

        // Управление джойстиком
        const joyBack = document.getElementById('joy-back');
        const knob = document.getElementById('joy-knob');

        window.addEventListener('touchstart', e => { if(e.target === joyBack || e.target === knob) joy.active = true; });
        window.addEventListener('touchmove', e => {
            if(!joy.active) return;
            let t = e.touches[0];
            let rect = joyBack.getBoundingClientRect();
            let dx = t.clientX - (rect.left + 50);
            let dy = t.clientY - (rect.top + 50);
            let dist = Math.sqrt(dx*dx + dy*dy);
            let angle = Math.atan2(dy, dx);
            let max = 40;
            
            let moveX = Math.cos(angle) * Math.min(dist, max);
            let moveY = Math.sin(angle) * Math.min(dist, max);
            knob.style.transform = translate(${moveX}px, ${moveY}px);
            
            joy.x = Math.cos(angle) * (Math.min(dist, max) / max);
            joy.y = Math.sin(angle) * (Math.min(dist, max) / max);
        });
        window.addEventListener('touchend', () => {
            joy.active = false;
            joy.x = 0; joy.y = 0;
            knob.style.transform = translate(0px, 0px);
        });

        function update() {
            if(isDead) return;

            // Движение игрока
            player.x += joy.x * player.speed;
            player.y += joy.y * player.speed;

            // Бот преследует
            let bdx = player.x - bot.x;
            let bdy = player.y - bot.y;
            let dist = Math.sqrt(bdx*bdx + bdy*bdy);
            bot.x += (bdx / dist) * bot.speed;
            bot.y += (bdy / dist) * bot.speed;

            if(dist < 40) {
                isDead = true;
                document.getElementById('died').style.display = 'flex';
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);// Рисуем сетку (пол)
            ctx.strokeStyle = '#222';
            for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i-player.x%50, 0); ctx.lineTo(i-player.x%50, canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0, i-player.y%50); ctx.lineTo(canvas.width, i-player.y%50); ctx.stroke(); }

            // Рисуем игрока (зеленый фонарик)
            ctx.fillStyle = '#0f0';
            ctx.shadowBlur = 20; ctx.shadowColor = '#0f0';
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 10, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Рисуем бота относительно игрока
            let relX = bot.x - player.x + canvas.width/2;
            let relY = bot.y - player.y + canvas.height/2;
            ctx.drawImage(bot.img, relX - bot.size/2, relY - bot.size/2, bot.size, bot.size);

            update();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
